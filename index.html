<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <!-- A-FrameとAR.jsのライブラリをインターネットから読み込む -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <!-- ARシーンの開始 -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-entity light="color: #BBB; type: point; groundColor: #e41b1b" data-aframe-default-light="" aframe-injected="" visible=""></a-entity>
      <!-- 3Dモデルの事前読み込み -->
      <a-assets>
        <a-entity light="color: #BBB; type: point; groundColor: #e41b1b" data-aframe-default-light="" aframe-injected="" visible=""></a-entity>
        <a-entity light="color: #d3c20d; intensity: 0.6; castShadow: true" position="-0.5 2.22 1" data-aframe-default-light="" aframe-injected="" visible=""></a-entity>
      </a-assets>

      <!-- Hiroマーカーを認識したときの処理 -->
      <a-marker preset="hiro">
         <!-- モデルを表示する (scaleで大きさを調整してください) -->
         <a-entity gltf-model="#myModel" scale="1 1 1" position="0 0 0"></a-entity>
      </a-marker>

      <!-- スマホのカメラを追加 -->
      <a-entity camera></a-entity>
      
    </a-scene>
  </body>
</html>
