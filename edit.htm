<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.jsの読み込みを削除しています -->
  </head>
  <body>
    <!-- arjs属性を削除し、ただの3D空間にします -->
    <a-scene>
      
      <a-assets>
        <a-asset-item id="myModel" src="model.glb"></a-asset-item>
      </a-assets>

      <!-- マーカーを削除し、モデルを直接空間に置きます -->
      <!-- カメラの少し前（z: -3）に配置すると見やすいです -->
      <a-entity gltf-model="#myModel" scale="1 1 1" position="0 0 -3"></a-entity>

      <!-- 自由に視点を動かせるPC用カメラ -->
      <a-entity camera look-controls orbit-controls="target: 0 0 -3; initialPosition: 0 1.5 1"></a-entity>
      
    </a-scene>
  </body>
</html>
